<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="color-scheme" content="light dark">
<title>RUMAHKU-ONE</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f4f6f5;--card:#fff;--ink:#14201e;--mute:#5b6b68;--line:#e1e7e5;--acc:#0f766e;--acc-ink:#fff;--soft:#e3f2ef;--warn:#b45309;--bad:#b91c1c;--ok:#15803d;--r:14px}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--card:#17201f;--ink:#e8f0ee;--mute:#9bb0ab;--line:#26332f;--acc:#2dd4bf;--acc-ink:#04201c;--soft:#15302c;--warn:#fbbf24;--bad:#f87171;--ok:#4ade80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:0 14px calc(150px + env(safe-area-inset-bottom))}
header#top{padding:calc(14px + env(safe-area-inset-top)) 2px 6px}
header#top h1{margin:0;font-size:1.35rem}
header#top p{margin:2px 0 0;color:var(--mute);font-size:.9rem}
h2{font-size:1rem;margin:20px 2px 8px;color:var(--mute);font-weight:600;letter-spacing:.02em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:4px 14px;margin-bottom:10px}
.card.pad{padding:14px}
.row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-height:48px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .t{overflow-wrap:anywhere}
.row .s{color:var(--mute);font-size:.84rem}
.row.done .t{text-decoration:line-through;color:var(--mute)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--mute);background:transparent;flex:none;padding:0;cursor:pointer;display:grid;place-items:center;color:var(--acc-ink);font-size:15px}
.chk.on{background:var(--acc);border-color:var(--acc)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--acc);color:var(--acc-ink);border:0;border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}
.btn.alt{background:var(--soft);color:var(--ink)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.9rem}
.link{background:none;border:0;color:var(--acc);padding:6px;font-weight:600;min-height:36px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;white-space:nowrap;min-height:38px}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.big{font-size:1.7rem;font-weight:700}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mute{color:var(--mute)}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.bar i.warn{background:var(--warn)}.bar i.over{background:var(--bad)}
.empty{color:var(--mute);padding:14px 2px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.grid .h{font-size:.75rem;color:var(--mute);padding:4px 0}
.day{border:0;background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:46px;padding:4px 0;position:relative}
.day.sel{outline:2px solid var(--acc)}
.day.today{font-weight:700;color:var(--acc)}
.day.off{visibility:hidden}
.day .dots{display:flex;justify-content:center;gap:3px;margin-top:2px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--acc)}
.day .dots i.t{background:var(--warn)}
nav#nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav#nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--mute);font-size:.72rem;min-height:56px}
nav#nav button b{display:block;font-size:1.25rem;font-weight:400;line-height:1.2}
nav#nav button.on{color:var(--acc);font-weight:700}
#fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(74px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;border:0;background:var(--acc);color:var(--acc-ink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 20px));max-height:92vh;background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form,dialog .menu{padding:16px;display:flex;flex-direction:column;gap:12px}
dialog h3{margin:0;font-size:1.1rem}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--mute)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:1rem;color:var(--ink);min-height:44px;width:100%}
label.f.c{flex-direction:row;align-items:center;gap:10px;color:var(--ink);font-size:1rem}
label.f.c input{width:22px;min-height:22px}
.err{color:var(--bad);font-size:.9rem;min-height:1.2em}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
.menu button{text-align:left}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom));background:#222;color:#fff;padding:10px 16px;border-radius:12px;z-index:20;max-width:90vw;display:none;font-size:.92rem}
.inl{display:flex;gap:8px;margin-bottom:10px}
.inl input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px;font-size:1rem;min-height:44px}
.note{font-size:.82rem;color:var(--mute);margin:6px 2px}
.tag{display:inline-block;font-size:.72rem;border-radius:99px;padding:1px 8px;background:var(--soft);margin-left:6px}
.tag.bad{background:var(--bad);color:#fff}.tag.warn{background:var(--warn);color:#000}
</style>
</head>
<body>
<div id="app">
  <header id="top"></header>
  <main id="main" aria-live="polite"></main>
</div>
<button id="fab" data-a="quick" aria-label="Tambah cepat">+</button>
<nav id="nav" aria-label="Menu utama">
  <button data-a="tab" data-v="today"><b>🏠</b>Hari ini</button>
  <button data-a="tab" data-v="tasks"><b>✅</b>Tugas</button>
  <button data-a="tab" data-v="cal"><b>📅</b>Kalender</button>
  <button data-a="tab" data-v="money"><b>💰</b>Uang</button>
  <button data-a="tab" data-v="more"><b>☰</b>Lainnya</button>
</nav>
<dialog id="dlg" aria-modal="true"></dialog>
<div id="toast" role="status"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
